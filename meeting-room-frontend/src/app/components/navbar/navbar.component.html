<style>
  /* Navbar Container */
  .navbar-custom {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    padding: 0 24px !important;
    height: 64px !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15) !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 1000 !important;
  }

  /* Brand Section */
  .brand-section {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    outline: none;
  }

  .brand-icon {
    font-size: 28px;
    width: 28px;
    height: 28px;
    color: white;
    transition: transform 0.3s ease;
  }

  .brand-section:hover .brand-icon {
    transform: rotate(-10deg) scale(1.1);
  }

  .brand-text {
    font-size: 20px;
    font-weight: 600;
    color: white;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* Spacer */
  .spacer {
    flex: 1 1 auto;
  }

  /* Desktop Navigation Container */
  .desktop-nav {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Navigation Buttons */
  .nav-button {
    color: rgba(255, 255, 255, 0.9) !important;
    font-weight: 500 !important;
    font-size: 14px !important;
    padding: 0 16px !important;
    height: 40px !important;
    border-radius: 8px !important;
    transition: all 0.3s ease !important;
    letter-spacing: 0.3px !important;
  }

  .nav-button:hover {
    background: rgba(255, 255, 255, 0.15) !important;
    color: white !important;
  }

  .nav-button mat-icon {
    margin-right: 6px;
    font-size: 20px;
    width: 20px;
    height: 20px;
    transition: transform 0.2s ease;
  }

  .nav-button:hover mat-icon {
    transform: scale(1.1);
  }

  /* Active Navigation Link */
  .active-link {
    background: rgba(255, 255, 255, 0.2) !important;
    color: white !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1) !important;
  }

  /* Role Chip */
  .role-chip {
    background: rgba(255, 255, 255, 0.2) !important;
    color: white !important;
    font-weight: 600 !important;
    font-size: 11px !important;
    letter-spacing: 0.5px !important;
    text-transform: uppercase !important;
    margin: 0 12px !important;
    padding: 4px 12px !important;
    border-radius: 16px !important;
    backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
  }

  /* Logout Button */
  .logout-button {
    color: white !important;
    transition: all 0.3s ease !important;
    margin-left: 4px !important;
  }

  .logout-button:hover {
    background: rgba(252, 129, 129, 0.2) !important;
    transform: rotate(-5deg);
  }

  .logout-button mat-icon {
    font-size: 22px;
    width: 22px;
    height: 22px;
  }

  /* Divider */
  .nav-divider {
    width: 1px;
    height: 28px;
    background: rgba(255, 255, 255, 0.25);
    margin: 0 8px;
  }

  /* Mobile Menu Button */
  .mobile-menu-button {
    display: none !important;
    color: white !important;
  }

  .mobile-menu-button mat-icon {
    font-size: 26px;
    width: 26px;
    height: 26px;
  }

  /* Mobile Navigation Overlay */
  .mobile-nav-overlay {
    display: none;
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    animation: fadeIn 0.3s ease;
  }

  .mobile-nav-overlay.show {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Mobile Navigation Drawer */
  .mobile-nav-drawer {
    position: fixed;
    top: 64px;
    right: -300px;
    width: 280px;
    height: calc(100vh - 64px);
    background: white;
    box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
    transition: right 0.3s ease;
    z-index: 1000;
    padding: 20px;
    overflow-y: auto;
  }

  .mobile-nav-drawer.show {
    right: 0;
  }

  .mobile-nav-drawer .nav-button {
    color: #4a5568 !important;
    width: 100%;
    justify-content: flex-start;
    margin-bottom: 4px;
    padding: 12px 16px !important;
  }

  .mobile-nav-drawer .nav-button:hover {
    background: rgba(102, 126, 234, 0.1) !important;
    color: #667eea !important;
  }

  .mobile-nav-drawer .active-link {
    background: rgba(102, 126, 234, 0.15) !important;
    color: #667eea !important;
  }

  .mobile-nav-drawer .role-chip {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    color: white !important;
    display: inline-flex;
    margin: 16px 0 !important;
  }

  .mobile-nav-drawer .nav-divider {
    background: #e2e8f0;
    margin: 12px 0;
  }

  .mobile-nav-drawer .logout-button {
    color: #fc8181 !important;
    width: 100%;
    justify-content: flex-start;
    margin-top: 8px;
  }

  .mobile-nav-drawer .logout-button:hover {
    background: rgba(252, 129, 129, 0.1) !important;
  }

  /* Responsive Styles */
  @media (max-width: 959px) {
    .desktop-nav {
      display: none !important;
    }

    .mobile-menu-button {
      display: inline-flex !important;
    }
  }

  @media (max-width: 599px) {
    .navbar-custom {
      padding: 0 16px !important;
      height: 56px !important;
    }

    .brand-text {
      font-size: 16px;
    }

    .brand-icon {
      font-size: 24px;
      width: 24px;
      height: 24px;
    }

    .mobile-nav-drawer {
      top: 56px;
      height: calc(100vh - 56px);
    }
  }
</style>

<mat-toolbar color="primary" class="navbar-custom" *ngIf="isLoggedIn">
  <!-- Brand -->
  <div class="brand-section" routerLink="/">
    <mat-icon class="brand-icon">meeting_room</mat-icon>
    <span class="brand-text">Meeting Room System</span>
  </div>
  
  <span class="spacer"></span>

  <!-- Desktop Navigation -->
  <div class="desktop-nav">
    <!-- Customer Navigation -->
    <ng-container *ngIf="group == 'Customer'">
      <button mat-button class="nav-button" routerLink="/rooms" routerLinkActive="active-link">
        <mat-icon>meeting_room</mat-icon>
        Rooms
      </button>
      <button mat-button class="nav-button" routerLink="/my-bookings" routerLinkActive="active-link">
        <mat-icon>calendar_today</mat-icon>
        My Bookings
      </button>
    </ng-container>

    <!-- Admin Navigation -->
    <ng-container *ngIf="group == 'Admin'">
      <button mat-button class="nav-button" routerLink="/admin/dashboard" routerLinkActive="active-link">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </button>
      <button mat-button class="nav-button" routerLink="/admin/manage-rooms" routerLinkActive="active-link">
        <mat-icon>settings</mat-icon>
        Manage Rooms
      </button>
      <button mat-button class="nav-button" routerLink="/admin/manage-bookings" routerLinkActive="active-link">
        <mat-icon>event_note</mat-icon>
        Manage Bookings
      </button>
    </ng-container>

    <div class="nav-divider"></div>
    
    <mat-chip class="role-chip">{{ group }}</mat-chip>
    
    <button mat-icon-button class="logout-button" (click)="logout()" matTooltip="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  </div>

  <!-- Mobile Menu Button -->
  <button mat-icon-button class="mobile-menu-button" (click)="toggleMobileMenu()">
    <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- Mobile Navigation Overlay -->
<div class="mobile-nav-overlay" [class.show]="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>

<!-- Mobile Navigation Drawer -->
<div class="mobile-nav-drawer" [class.show]="isMobileMenuOpen">
  <!-- Customer Navigation -->
  <ng-container *ngIf="group == 'Customer'">
    <button mat-button class="nav-button" routerLink="/rooms" routerLinkActive="active-link" (click)="toggleMobileMenu()">
      <mat-icon>meeting_room</mat-icon>
      Rooms
    </button>
    <button mat-button class="nav-button" routerLink="/my-bookings" routerLinkActive="active-link" (click)="toggleMobileMenu()">
      <mat-icon>calendar_today</mat-icon>
      My Bookings
    </button>
  </ng-container>

  <!-- Admin Navigation -->
  <ng-container *ngIf="group == 'Admin'">
    <button mat-button class="nav-button" routerLink="/admin/dashboard" routerLinkActive="active-link" (click)="toggleMobileMenu()">
      <mat-icon>dashboard</mat-icon>
      Dashboard
    </button>
    <button mat-button class="nav-button" routerLink="/admin/manage-rooms" routerLinkActive="active-link" (click)="toggleMobileMenu()">
      <mat-icon>settings</mat-icon>
      Manage Rooms
    </button>
    <button mat-button class="nav-button" routerLink="/admin/manage-bookings" routerLinkActive="active-link" (click)="toggleMobileMenu()">
      <mat-icon>event_note</mat-icon>
      Manage Bookings
    </button>
  </ng-container>

  <div class="nav-divider"></div>
  
  <mat-chip class="role-chip">{{ group }}</mat-chip>
  
  <button mat-button class="logout-button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</div>

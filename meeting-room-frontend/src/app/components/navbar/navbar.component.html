<nav *ngIf="isLoggedIn" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand"> Meeting Room System </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <!-- CUSTOMER -->

        <ng-container *ngIf="group == 'Customer'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/rooms"> Rooms </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/my-bookings"> My Bookings </a>
          </li>
        </ng-container>

        <!-- ADMIN -->

        <ng-container *ngIf="group == 'Admin'">
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/manage-rooms">
              Manage Rooms
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/manage-bookings">
              Manage Bookings
            </a>
          </li>
        </ng-container>

        <!-- LOGOUT -->

        <li class="nav-item">
          <a
            class="nav-link text-danger"
            style="cursor: pointer"
            (click)="logout()"
          >
            Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<style>
  /* Container */
  .not-found-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7fafc;
    padding: 20px;
  }

  .not-found-wrapper {
    text-align: center;
    max-width: 500px;
    width: 100%;
  }

  /* 404 Number */
  .error-code {
    font-size: 120px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
    letter-spacing: -4px;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  /* Icon */
  .error-icon {
    font-size: 64px;
    width: 64px;
    height: 64px;
    color: #fc8181;
    margin-bottom: 20px;
    animation: shake 0.5s ease-in-out;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }

  /* Title */
  .error-title {
    font-size: 28px;
    font-weight: 700;
    color: #2d3748;
    margin-bottom: 12px;
  }

  /* Description */
  .error-description {
    font-size: 16px;
    color: #718096;
    margin-bottom: 32px;
    line-height: 1.5;
  }

  /* Buttons */
  .action-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary-action {
    padding: 14px 28px !important;
    font-size: 15px !important;
    font-weight: 500 !important;
    border-radius: 10px !important;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
    color: white !important;
    box-shadow: none !important;
    transition: all 0.3s ease !important;
    border: none !important;
    cursor: pointer;
    display: flex !important;
    align-items: center;
    gap: 8px;
    height: 48px !important;
  }

  .btn-primary-action:hover {
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4) !important;
    transform: translateY(-2px);
  }

  .btn-secondary-action {
    padding: 14px 28px !important;
    font-size: 15px !important;
    font-weight: 500 !important;
    border-radius: 10px !important;
    background: white !important;
    color: #667eea !important;
    border: 1.5px solid #667eea !important;
    box-shadow: none !important;
    transition: all 0.3s ease !important;
    cursor: pointer;
    display: flex !important;
    align-items: center;
    gap: 8px;
    height: 48px !important;
  }

  .btn-secondary-action:hover {
    background: rgba(102, 126, 234, 0.05) !important;
    transform: translateY(-2px);
  }

  /* Decorative Elements */
  .decorative-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.05;
    pointer-events: none;
  }

  .circle-1 {
    width: 300px;
    height: 300px;
    background: #667eea;
    top: -100px;
    left: -100px;
  }

  .circle-2 {
    width: 200px;
    height: 200px;
    background: #764ba2;
    bottom: -50px;
    right: -50px;
  }

  .circle-3 {
    width: 150px;
    height: 150px;
    background: #667eea;
    top: 50%;
    right: -30px;
  }

  /* Responsive */
  @media (max-width: 576px) {
    .error-code {
      font-size: 80px;
    }

    .error-icon {
      font-size: 48px;
      width: 48px;
      height: 48px;
    }

    .error-title {
      font-size: 22px;
    }

    .error-description {
      font-size: 14px;
    }

    .action-buttons {
      flex-direction: column;
      align-items: center;
    }

    .btn-primary-action,
    .btn-secondary-action {
      width: 100%;
      justify-content: center;
    }
  }
</style>

<div class="not-found-container">
  <!-- Decorative Circles -->
  <div class="decorative-circle circle-1"></div>
  <div class="decorative-circle circle-2"></div>
  <div class="decorative-circle circle-3"></div>

  <div class="not-found-wrapper">
    <!-- Error Code -->
    <div class="error-code">404</div>

    <!-- Icon -->
    <mat-icon class="error-icon">sentiment_dissatisfied</mat-icon>

    <!-- Title -->
    <h2 class="error-title">Page Not Found</h2>

    <!-- Description -->
    <p class="error-description">
      Oops! The page you're looking for doesn't exist or has been moved. 
      Let's get you back on track.
    </p>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button mat-raised-button class="btn-primary-action" (click)="logout()">
        <mat-icon>login</mat-icon>
        Go To Login
      </button>
      
      <button mat-stroked-button class="btn-secondary-action" routerLink="/rooms">
        <mat-icon>meeting_room</mat-icon>
        Browse Rooms
      </button>
    </div>
  </div>
</div>

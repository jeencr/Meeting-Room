<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="mb-4">Book Meeting Room</h3>

        <div class="mb-3">
          <label> Date </label>

          <input type="date" class="form-control" [(ngModel)]="date" />
        </div>

        <div class="mb-3">
          <label> Start Time </label>

          <input type="time" class="form-control" [(ngModel)]="start_time" />
        </div>

        <div class="mb-3">
          <label> End Time </label>

          <input type="time" class="form-control" [(ngModel)]="end_time" />
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <button class="btn btn-primary w-100" (click)="createBooking()">
          Create Booking
        </button>
      </div>
    </div>
  </div>
</div>

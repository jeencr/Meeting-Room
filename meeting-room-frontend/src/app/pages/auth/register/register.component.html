<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4">
        <h3 class="text-center mb-4">Register</h3>

        <div class="mb-3">
          <label> First Name </label>

          <input type="text" class="form-control" [(ngModel)]="first_name" />
        </div>

        <div class="mb-3">
          <label> Last Name </label>

          <input type="text" class="form-control" [(ngModel)]="last_name" />
        </div>

        <div class="mb-3">
          <label> Username </label>

          <input type="text" class="form-control" [(ngModel)]="username" />
        </div>

        <div class="mb-3">
          <label> Email </label>

          <input type="email" class="form-control" [(ngModel)]="email" />
        </div>

        <div class="mb-3">
          <label> Password </label>

          <input type="password" class="form-control" [(ngModel)]="password" />
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>

        <button class="btn btn-success w-100" (click)="register()">
          Register
        </button>
      </div>
    </div>
  </div>
</div>
